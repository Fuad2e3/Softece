# Publishes the site to GitHub Pages, writing the order endpoint in on the way.
#
# The Apps Script URL is never committed: it lives in the SHEET_ENDPOINT
# repository secret (Settings -> Secrets and variables -> Actions) and is
# written into index.html here, during the build. Without the secret the site
# still publishes — the order form just falls back to the mail client.
#
# This needs Settings -> Pages -> Source set to "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the order endpoint into the page
        env:
          SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
        run: |
          python3 -c '
          import os, pathlib
          url = os.environ.get("SHEET_ENDPOINT", "").strip()
          page = pathlib.Path("index.html")
          html = page.read_text(encoding="utf-8")
          marker = "data-sheet=\"\""
          if url and marker in html:
              page.write_text(html.replace(marker, f"data-sheet=\"{url}\"", 1), encoding="utf-8")
              print("inject-endpoint: endpoint injected into index.html")
          else:
              print("inject-endpoint: SHEET_ENDPOINT is empty or marker missing.")
          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
